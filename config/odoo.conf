[options]
; Connexion PostgreSQL et admin_passwd sont fournis par la commande Compose.
; Les variables ${...} ne sont pas interpolées dans ce fichier monté.
proxy_mode = True
list_db = False
workers = 2
max_cron_threads = 1
gevent_port = 8072
limit_memory_soft = 1073741824
limit_memory_hard = 1610612736
limit_time_cpu = 600
limit_time_real = 1200
